<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Zane Bajati — Supply Chain Management Student at Rutgers">
<title>Zane Bajati | Supply Chain Management</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --line:#e5e7eb;
  --accent:#4f46e5;
  --accent2:#7c3aed;
  --dark:#0b1020;
  --max:1120px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.65;
}

a{color:inherit}
.nav{
  position:fixed;top:0;left:0;right:0;z-index:20;
  background:rgba(246,247,251,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(229,231,235,.8);
}

.nav-inner{
  max-width:var(--max);margin:auto;padding:17px 24px;
  display:flex;align-items:center;justify-content:space-between;
}

.brand{font-weight:850;letter-spacing:-.04em;font-size:1.25rem}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-links a{text-decoration:none;color:#475569;font-size:.92rem;font-weight:600}
.nav-links a:hover{color:var(--accent)}

.hero{
  min-height:100vh;display:flex;align-items:center;
  padding:130px 24px 90px;overflow:hidden;
  background:
    radial-gradient(circle at 80% 20%,rgba(124,58,237,.16),transparent 30%),
    radial-gradient(circle at 10% 80%,rgba(79,70,229,.12),transparent 30%),
    var(--bg);
}

.hero-inner{
  width:100%;max-width:var(--max);margin:auto;
  display:grid;grid-template-columns:1.2fr .8fr;gap:70px;align-items:center;
}

.eyebrow{
  color:var(--accent);font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;font-size:.78rem;margin-bottom:16px;
}

h1{
  font-size:clamp(3.5rem,7vw,6.7rem);line-height:.95;
  letter-spacing:-.075em;margin-bottom:25px;
}

.gradient{
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.hero-sub{
  font-size:1.2rem;max-width:700px;color:#475569;margin-bottom:32px;
}

.buttons{display:flex;gap:12px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:12px 18px;border-radius:11px;text-decoration:none;
  font-weight:750;font-size:.94rem;border:1px solid var(--line);
  transition:.2s ease;
}

.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(15,23,42,.18)}
.btn-light{background:#fff;color:var(--text)}
.btn-light:hover{transform:translateY(-2px);border-color:#cbd5e1}

.hero-photo-wrap{display:flex;justify-content:center}

.hero-photo{
  width:min(390px,82vw);aspect-ratio:3/4;object-fit:cover;
  border-radius:28px;box-shadow:0 30px 80px rgba(15,23,42,.2);
  transform:rotate(2deg);
  border:8px solid rgba(255,255,255,.75);
}

section{max-width:var(--max);margin:auto;padding:105px 24px}

.section-label{
  color:var(--accent);font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;font-size:.75rem;margin-bottom:9px;
}

.section-title{
  font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.055em;
  margin-bottom:14px;
}

.section-intro{color:var(--muted);max-width:750px;margin-bottom:42px}
.about-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:28px}

.statement,.info-card,.experience,.project,.skill-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 8px 30px rgba(15,23,42,.045);
}

.statement{padding:32px}
.statement p{font-size:1.22rem;line-height:1.7;color:#334155}

.info-card{padding:28px}
.info-card h3{margin-bottom:18px}

.info-row{padding:11px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.info-row:last-child{border-bottom:0}
.info-row span{
  display:block;color:var(--muted);font-size:.76rem;
  text-transform:uppercase;letter-spacing:.08em;font-weight:800;
}

.timeline{display:grid;gap:18px}
.experience{padding:27px}

.exp-top{
  display:flex;justify-content:space-between;gap:20px;align-items:flex-start;
}

.experience h3{font-size:1.15rem}
.role{color:var(--accent);font-weight:750;margin-top:2px}
.date{color:#94a3b8;font-size:.86rem;white-space:nowrap}

.experience ul{margin:16px 0 0 20px;color:#475569}
.experience li{margin:7px 0}

.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.project{padding:28px;position:relative;overflow:hidden}

.project:before{
  content:"";position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.project-num{font-size:.75rem;color:var(--accent);font-weight:850;letter-spacing:.1em}
.project h3{font-size:1.35rem;margin:10px 0}
.project p{color:#64748b}

.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

.tag{
  background:#f1f5f9;color:#475569;padding:5px 9px;
  border-radius:999px;font-size:.75rem;font-weight:700;
}

.skills{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
}

.skill-card{padding:22px;font-weight:750}
.skill-card small{
  display:block;color:var(--muted);font-weight:500;margin-top:4px;
}

.beyond{background:var(--dark);color:white;max-width:none}
.beyond-inner{max-width:var(--max);margin:auto}
.beyond .section-label{color:#a5b4fc}
.beyond .section-intro{color:#aeb7c9}

.interest-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.interest{
  border:1px solid rgba(255,255,255,.1);border-radius:22px;
  overflow:hidden;background:rgba(255,255,255,.045);
}

.interest-image{
  height:230px;width:100%;object-fit:contain;display:block;background:#0b1020;
}

.interest-content{padding:23px}
.interest h3{margin-bottom:7px}
.interest p{color:#b9c1d0}

.music-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}

.artist{
  overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04)
}

.artist img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.artist div{padding:12px 14px;font-weight:750}

.contact{
  text-align:center;background:#fff;border-top:1px solid var(--line);
}

.contact-card{max-width:800px;margin:auto}

.email{
  display:inline-block;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:800;
  text-decoration:none;margin:18px 0 25px;color:var(--accent);
}

.footer{
  text-align:center;padding:30px 24px;color:#94a3b8;
  background:#fff;border-top:1px solid var(--line);font-size:.85rem;
}

@media(max-width:850px){
  .hero-inner,.about-grid{grid-template-columns:1fr}
  .hero{padding-top:120px}
  .hero-photo-wrap{order:-1}
  .hero-photo{width:min(300px,75vw)}
  .skills{grid-template-columns:repeat(2,1fr)}
  .project-grid,.interest-grid{grid-template-columns:1fr}
  .music-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:600px){
  .nav-links{display:none}
  section{padding:75px 18px}
  .hero{padding-left:18px;padding-right:18px}
  .hero-sub{font-size:1.05rem}
  .exp-top{display:block}
  .date{display:block;margin-top:5px}
  .skills{grid-template-columns:1fr 1fr}
  .music-grid{grid-template-columns:1fr}
  .artist{display:grid;grid-template-columns:90px 1fr;align-items:center}
  .artist img{height:90px}
}

.cert{
  margin-top:22px;border-top:1px solid var(--line);padding-top:18px
}

.cert-label{
  font-size:.75rem;color:var(--accent);font-weight:850;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px
}

.cert-thumb{
  display:block;width:100%;padding:0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;cursor:zoom-in;background:#fff;
  box-shadow:0 6px 20px rgba(15,23,42,.08)
}

.cert-thumb img{display:block;width:100%;height:auto}

.cert-actions{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:12px
}

.cert-actions a,.cert-actions button{
  font:inherit;font-size:.85rem;font-weight:700;padding:8px 14px;
  border-radius:999px;border:1px solid var(--line);
  background:#f1f5f9;color:#334155;cursor:pointer;text-decoration:none
}

.cert-actions a:hover,.cert-actions button:hover{
  color:var(--accent);border-color:var(--accent)
}

.cert-modal{
  position:fixed;inset:0;background:rgba(15,23,42,.85);
  display:none;align-items:center;justify-content:center;
  z-index:1000;padding:24px
}

.cert-modal.open{display:flex}

.cert-modal img{
  max-width:100%;max-height:100%;border-radius:10px;
  background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)
}

.cert-close{
  position:absolute;top:16px;right:20px;font-size:2rem;
  line-height:1;color:#fff;background:none;border:0;cursor:pointer
}
</style>
</head>
